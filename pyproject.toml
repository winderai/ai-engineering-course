[project]
name = "brewops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "html2text>=2025.4.15",
    "litellm[caching]>=1.75.8",
    "python-dotenv>=1.1.1",
    "uvicorn[standard]>=0.24.0",
    "duckdb>=1.1.3",
    "numpy>=1.24.0,<2.0.0",
    "httpx>=0.27.0",
    "mlflow[extras]>=3.3.2",
    "dspy-ai>=3.0.3",
    "gputil>=1.4.0",
    "openlit>=1.35.3",
    "trl>=0.23.0",
    "peft>=0.17.1",
]

[dependency-groups]
dev = [
    "lighteval>=0.10.0",
    "pyright>=1.1.405",
    "ruff>=0.12.9",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["**/__pycache__"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
